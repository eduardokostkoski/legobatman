<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LEGO Batman - Bat Terminal</title>
  <link rel="stylesheet" href="index.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div class="main-layout">
    <!-- Container 3D do Lego Batman -->
    <div id="canvas-container"></div>

    <!-- Container do Chat -->
    <div class="chat-container">
      <header class="chat-header">
        <h1>BAT-TERMINAL DE COMUNICAÇÃO</h1>
      </header>

      <!-- Área de exibição das mensagens -->
      <div id="chat-box" class="chat-box">
        <div class="mensagem bat-msg">
          <strong>LEGO Batman:</strong>
          <p>Eu sou o Batman! O que você quer? Seja rápido, minha lagosta está esquentando no micro-ondas.</p>
        </div>
      </div>

      <!-- Formulário de envio -->
      <form id="chat-form" class="chat-input-area">
        <input type="text" id="chat-input" placeholder="Digite sua mensagem para o Batman..." autocomplete="off" required>
        <button type="submit" id="btnEnviar">Enviar</button>
      </form>
    </div>
  </div>

  <!-- LÓGICA DO CHAT E INTEGRAÇÃO COM ANIMAÇÃO -->
  <script>
    const chatForm = document.getElementById('chat-form');
    const chatInput = document.getElementById('chat-input');
    const chatBox = document.getElementById('chat-box');

    const historicoMensagens = [];
    
    // Variável global controlada pelo chat para acionar a animação de pensar
    window.batmanPensando = false;

    function adicionarMensagem(autor, texto, classe) {
      const msgDiv = document.createElement('div');
      msgDiv.classList.add('mensagem', classe);
      
      const strong = document.createElement('strong');
      strong.innerText = autor + ':';
      
      const p = document.createElement('p');
      p.innerText = texto;

      msgDiv.appendChild(strong);
      msgDiv.appendChild(p);
      chatBox.appendChild(msgDiv);

      chatBox.scrollTop = chatBox.scrollHeight;
    }

    chatForm.addEventListener('submit', async (e) => {
      e.preventDefault();

      const textoUsuario = chatInput.value.trim();
      if (!textoUsuario) return;

      adicionarMensagem('Você', textoUsuario, 'user-msg');
      chatInput.value = '';

      historicoMensagens.push({ role: 'user', content: textoUsuario });

      const msgCarregando = document.createElement('div');
      msgCarregando.classList.add('mensagem', 'bat-msg');
      msgCarregando.innerHTML = '<strong>LEGO Batman:</strong><p>Pensando em algo incrível...</p>';
      chatBox.appendChild(msgCarregando);
      chatBox.scrollTop = chatBox.scrollHeight;

      // Ativa a animação de pensar no modelo 3D
      window.batmanPensando = true;

      try {
        const response = await fetch('/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ historico: historicoMensagens })
        });

        const data = await response.json();
        
        if (chatBox.contains(msgCarregando)) {
          chatBox.removeChild(msgCarregando);
        }

        if (response.ok && data.resposta) {
          adicionarMensagem('LEGO Batman', data.resposta, 'bat-msg');
          historicoMensagens.push({ role: 'assistant', content: data.resposta });
        } else {
          adicionarMensagem('LEGO Batman', data.erro || 'Minhas Bat-ferramentas falharam!', 'bat-msg');
        }
      } catch (err) {
        if (chatBox.contains(msgCarregando)) {
          chatBox.removeChild(msgCarregando);
        }
        adicionarMensagem('LEGO Batman', 'O Coringa cortou os cabos da Batcaverna! Tente novamente mais tarde.', 'bat-msg');
      } finally {
        // Desativa a animação de pensar ao receber a resposta
        window.batmanPensando = false;
      }
    });
  </script>

  <!-- THREE.JS COM ANIMAÇÃO DA CABEÇA E MODO PENSANDO -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const container = document.getElementById('canvas-container');
      if (!container) return;

      const scene = new THREE.Scene();

      const getWidth = () => container.clientWidth || 180;
      const getHeight = () => container.clientHeight || 480;
      let aspect = getWidth() / getHeight();
      const d = 2.4;

      const camera = new THREE.OrthographicCamera(-d * aspect, d * aspect, d, -d, 0.1, 1000);
      camera.position.set(0, 0, 10);
      camera.lookAt(0, 0, 0);

      const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setSize(getWidth(), getHeight());
      container.appendChild(renderer.domElement);

      const ambientLight = new THREE.AmbientLight(0xffffff, 1);
      scene.add(ambientLight);

      // Materiais
      const blackMat = new THREE.MeshBasicMaterial({ color: 0x111111 });
      const yellowMat = new THREE.MeshBasicMaterial({ color: 0xf1c40f });
      const skinMat = new THREE.MeshBasicMaterial({ color: 0xf5cba7 });
      const whiteMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
      const headMat = new THREE.MeshBasicMaterial({ color: 0x181818 });

      const legoBatman = new THREE.Group();

      // --- GRUPO DA CABEÇA (SEPARADO PARA GIRAR INDEPENDENTE) ---
      const headGroup = new THREE.Group();
      headGroup.position.set(0, 1.5, 0);

      const head = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.7, 0.1), headMat);
      headGroup.add(head);

      const earGeo = new THREE.ConeGeometry(0.12, 0.35, 3);
      const leftEar = new THREE.Mesh(earGeo, headMat);
      leftEar.position.set(-0.3, 0.45, 0);
      const rightEar = new THREE.Mesh(earGeo, headMat);
      rightEar.position.set(0.3, 0.45, 0);
      headGroup.add(leftEar, rightEar);

      const face = new THREE.Mesh(new THREE.PlaneGeometry(0.6, 0.3), skinMat);
      face.position.set(0, -0.02, 0.06);
      headGroup.add(face);

      const eyeGeo = new THREE.PlaneGeometry(0.15, 0.06);
      const leftEye = new THREE.Mesh(eyeGeo, whiteMat);
      leftEye.position.set(-0.16, 0.05, 0.07);
      const rightEye = new THREE.Mesh(eyeGeo, whiteMat);
      rightEye.position.set(0.16, 0.05, 0.07);
      headGroup.add(leftEye, rightEye);

      legoBatman.add(headGroup);

      // --- CORPO E MEMBROS ---
      const torso = new THREE.Mesh(new THREE.PlaneGeometry(1.2, 1.1), blackMat);
      torso.position.y = 0.65;
      legoBatman.add(torso);

      const batLogoBg = new THREE.Mesh(new THREE.CircleGeometry(0.28, 32), yellowMat);
      batLogoBg.scale.set(1.1, 0.7, 1);
      batLogoBg.position.set(0, 0.8, 0.06);
      legoBatman.add(batLogoBg);

      const batShape = new THREE.Shape();
      batShape.moveTo(0, 0.08);
      batShape.lineTo(-0.06, 0.14);
      batShape.lineTo(-0.1, 0.08);
      batShape.lineTo(-0.2, 0.1);
      batShape.lineTo(-0.14, -0.08);
      batShape.lineTo(0, -0.02);
      batShape.lineTo(0.14, -0.08);
      batShape.lineTo(0.2, 0.1);
      batShape.lineTo(0.1, 0.08);
      batShape.lineTo(0.06, 0.14);
      batShape.closePath();

      const batSymbol = new THREE.Mesh(new THREE.ShapeGeometry(batShape), blackMat);
      batSymbol.position.set(0, 0.78, 0.07);
      legoBatman.add(batSymbol);

      const belt = new THREE.Mesh(new THREE.PlaneGeometry(1.2, 0.2), yellowMat);
      belt.position.set(0, 0.1, 0.06);
      legoBatman.add(belt);

      const leftArm = new THREE.Mesh(new THREE.PlaneGeometry(0.25, 0.8), blackMat);
      leftArm.position.set(-0.75, 0.65, 0);
      const rightArm = new THREE.Mesh(new THREE.PlaneGeometry(0.25, 0.8), blackMat);
      rightArm.position.set(0.75, 0.65, 0);
      legoBatman.add(leftArm, rightArm);

      const handGeo = new THREE.RingGeometry(0.06, 0.12, 16, 1, 0, Math.PI * 1.5);
      const leftHand = new THREE.Mesh(handGeo, yellowMat);
      leftHand.position.set(-0.75, 0.18, 0.06);
      const rightHand = new THREE.Mesh(handGeo, yellowMat);
      rightHand.position.set(0.75, 0.18, 0.06);
      legoBatman.add(leftHand, rightHand);

      const leftLeg = new THREE.Mesh(new THREE.PlaneGeometry(0.42, 0.8), blackMat);
      leftLeg.position.set(-0.25, -0.4, 0);
      const rightLeg = new THREE.Mesh(new THREE.PlaneGeometry(0.42, 0.8), blackMat);
      rightLeg.position.set(0.25, -0.4, 0);
      legoBatman.add(leftLeg, rightLeg);

      legoBatman.position.y = -0.5;
      scene.add(legoBatman);

      // MOUSE
      let mouseX = 0;
      let mouseY = 0;

      window.addEventListener('mousemove', (e) => {
        mouseX = (e.clientX / window.innerWidth) * 2 - 1;
        mouseY = -(e.clientY / window.innerHeight) * 2 + 1;
      });

      // LOOP DE ANIMAÇÃO
      function animate(time) {
        requestAnimationFrame(animate);

        const clock = time * 0.003;

        // 1. Flutuação geral
        legoBatman.position.y = -0.5 + Math.sin(clock * 2) * 0.08;

        if (window.batmanPensando) {
          // --- ANIMAÇÃO PENSANDO ---
          // Cabeça inclina e balança rápido de um lado para o outro
          headGroup.rotation.z = Math.sin(clock * 8) * 0.25;
          headGroup.rotation.y = Math.cos(clock * 6) * 0.3;
          headGroup.rotation.x = -0.15;

          // Levanta a mão direita até o queixo/cabeça
          rightArm.rotation.z = 1.2;
          leftArm.rotation.z = Math.sin(clock * 4) * 0.1;
        } else {
          // --- ANIMAÇÃO NORMAL (SEGUINDO O MOUSE) ---
          // A cabeça segue o ponteiro do mouse
          const targetHeadY = mouseX * 0.6;
          const targetHeadX = -mouseY * 0.3;

          headGroup.rotation.y += (targetHeadY - headGroup.rotation.y) * 0.1;
          headGroup.rotation.x += (targetHeadX - headGroup.rotation.x) * 0.1;
          headGroup.rotation.z += (0 - headGroup.rotation.z) * 0.1;

          // O corpo acompanha ligeiramente
          legoBatman.rotation.y += (mouseX * 0.15 - legoBatman.rotation.y) * 0.05;

          // Braços balançam normalmente
          leftArm.rotation.z = Math.sin(clock * 2) * 0.08;
          rightArm.rotation.z = -Math.sin(clock * 2) * 0.08;
        }

        renderer.render(scene, camera);
      }

      animate(0);

      window.addEventListener('resize', () => {
        const w = getWidth();
        const h = getHeight();
        if (w === 0 || h === 0) return;
        
        const newAspect = w / h;
        camera.left = -d * newAspect;
        camera.right = d * newAspect;
        camera.top = d;
        camera.bottom = -d;
        camera.updateProjectionMatrix();
        renderer.setSize(w, h);
      });
    });
  </script>
</body>
</html>
