<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LEGO Batman - Cadastro</title>
  <link rel="stylesheet" href="cadastro.css">
</head>
<body>

  <div class="main-wrapper">
    <div class="image-container">
      <img src="Batman_29.webp" alt="Batman" class="bat-img">
    </div>

    <form id="bat-form" class="bat-container">
      <h2 class="bat-title">Novo Herói</h2>

      <label for="nome">Nome do Herói:</label>
      <input type="text" id="nome" name="nome" placeholder="Ex: Bruce Wayne" required>

      <label for="email">Bat-Email:</label>
      <input type="email" id="email" name="email" placeholder="batman@batcave.com" required>

      <label for="senha">Bat-Senha:</label>
      <input type="password" id="senha" name="senha" placeholder="Mínimo 8 caracteres" required minlength="8">

      <button type="submit" id="btnCadastrar">Entrar na Batcaverna</button>
      
      <div class="cadastro-link">
        <p>Já possui conta?</p>
        <button type="button" id="btnIrLogin" class="btn-ir-cadastro">Faça Login</button>
      </div>

      <div id="mensagemCadastro"></div>
    </form>
  </div>

  <script>
    const form = document.getElementById('bat-form');
    const mensagemCadastro = document.getElementById('mensagemCadastro');
    const btnIrLogin = document.getElementById('btnIrLogin');

    btnIrLogin.addEventListener('click', () => {
      window.location.href = 'index.html';
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const usuario = document.getElementById('nome').value;
      const email = document.getElementById('email').value;
      const senha = document.getElementById('senha').value;

      if (senha.length < 8) {
        mensagemCadastro.innerText = 'A senha deve conter no mínimo 8 caracteres!';
        mensagemCadastro.style.color = '#ff4d4d';
        return;
      }

      try {
        const response = await fetch('/cadastro', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ usuario, email, senha })
        });

        const data = await response.json();

        if (response.ok) {
          mensagemCadastro.style.color = '#00ff00';
          mensagemCadastro.innerText = 'Cadastro realizado com sucesso! Redirecionando...';
          setTimeout(() => {
            window.location.href = 'chatbot.html';
          }, 1200);
        } else {
          mensagemCadastro.style.color = '#ff4d4d';
          mensagemCadastro.innerText = data.erro || 'Erro ao realizar cadastro.';
        }
      } catch (err) {
        mensagemCadastro.style.color = '#ff4d4d';
        mensagemCadastro.innerText = 'Erro ao conectar com o servidor.';

    alert("Cadastro realizado! Faça login para continuar.");
    window.location.href = '/index.html';
}
      
      }
    });
  </script>
</body>
</html>
