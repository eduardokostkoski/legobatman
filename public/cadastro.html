<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Bat-Terminal</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #1e1e1e; padding: 2rem; border-radius: 8px; width: 100%; max-width: 320px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        h2 { text-align: center; color: #f5c518; margin-bottom: 1.5rem; }
        input { width: 100%; padding: 10px; margin-bottom: 1rem; border-radius: 4px; border: 1px solid #333; background: #2a2a2a; color: #fff; box-sizing: border-box; }
        button { width: 100%; padding: 10px; border: none; border-radius: 4px; background: #f5c518; color: #000; font-weight: bold; cursor: pointer; }
        button:hover { background: #e0b000; }
        p { text-align: center; margin-top: 1rem; font-size: 0.9rem; }
        a { color: #f5c518; text-decoration: none; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Criar Bat-Conta</h2>
        <form id="form-cadastro">
            <input type="text" id="usuario" placeholder="Nome de Usuário" required />
            <input type="email" id="email" placeholder="E-mail" required />
            <input type="password" id="senha" placeholder="Senha (mín. 8 caracteres)" required />
            <button type="submit">Cadastrar</button>
        </form>
        <p>Já tem uma conta? <a href="index.html">Faça Login</a></p>
    </div>

    <script>
        document.getElementById('form-cadastro').addEventListener('submit', async (e) => {
            e.preventDefault();

            const usuario = document.getElementById('usuario').value;
            const email = document.getElementById('email').value;
            const senha = document.getElementById('senha').value;

            try {
                const resposta = await fetch('/cadastro', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ usuario, email, senha })
                });

                const data = await resposta.json();

                if (resposta.ok) {
                    alert("Cadastro realizado com sucesso! Faça login para continuar.");
                    // Redireciona para o login em vez de ir para o chat
                    window.location.href = "index.html";
                } else {
                    alert(data.erro || "Erro ao realizar cadastro.");
                }
            } catch (err) {
                alert("Erro de conexão com o servidor.");
            }
        });
    </script>
</body>
</html>
